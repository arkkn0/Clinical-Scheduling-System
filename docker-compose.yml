services:
  mysql:
    image: mysql:8.0
    container_name: clinical-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-clinical_root_dev}
      MYSQL_DATABASE: clinical_scheduling
      MYSQL_USER: clinical
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-clinical_dev}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uclinical -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: clinical-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://clinical:${MYSQL_PASSWORD:-clinical_dev}@mysql:3306/clinical_scheduling
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
