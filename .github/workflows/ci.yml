name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: clinical_scheduling_test
          MYSQL_USER: clinical
          MYSQL_PASSWORD: clinical_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uclinical -pclinical_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: alembic upgrade head
        env:
          DATABASE_URL: mysql+pymysql://clinical:clinical_test@127.0.0.1:3306/clinical_scheduling_test
      - run: pytest
        env:
          TEST_DATABASE_URL: mysql+pymysql://clinical:clinical_test@127.0.0.1:3306/clinical_scheduling_test
