name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: clinical_scheduling_test
          MYSQL_USER: clinical
          MYSQL_PASSWORD: clinical_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uclinical -pclinical_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Verify migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: mysql+pymysql://clinical:clinical_test@127.0.0.1:3306/clinical_scheduling_test
      - name: API contract tests
        run: python -m pytest -o addopts="-ra --strict-markers" tests/test_api.py
        env:
          PYTEST_ADDOPTS: ""
      - name: MySQL concurrency integration test
        run: python -m pytest -o addopts="-ra --strict-markers" tests/test_concurrency.py
        env:
          PYTEST_ADDOPTS: ""
          TEST_DATABASE_URL: mysql+pymysql://clinical:clinical_test@127.0.0.1:3306/clinical_scheduling_test
